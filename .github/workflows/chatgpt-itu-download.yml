name: ChatGPT ITU-R corrected-version PDFs

on:
  push:
    branches:
      - chatgpt-itu-pdf-download-20260903
    paths:
      - '.github/workflows/chatgpt-itu-download.yml'

permissions:
  contents: read

jobs:
  corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Download corrected current versions
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile itu_pdf_bundle/correct_stale.py
          python itu_pdf_bundle/correct_stale.py

      - name: Validate generated PDF files
        shell: bash
        run: |
          set -euxo pipefail
          find out -type f -name '*.pdf' -print0 | xargs -0 -r file
          printf 'PDF_COUNT=' >> "$GITHUB_STEP_SUMMARY"
          find out -type f -name '*.pdf' | wc -l >> "$GITHUB_STEP_SUMMARY"
          du -sh out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corrected-version PDFs
        uses: actions/upload-artifact@v4
        with:
          name: itu-r-1200-1400-corrected-versions
          path: out/ITU-R建议书1200-1400MHz汇总（版本校正补充）
          if-no-files-found: error
          retention-days: 7
