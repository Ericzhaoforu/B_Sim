name: ChatGPT ITU-R PDF retry bundle

on:
  push:
    branches:
      - chatgpt-itu-pdf-download-20260903
    paths:
      - '.github/workflows/chatgpt-itu-download.yml'

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Retry missing ITU-R PDFs sequentially
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile itu_pdf_bundle/retry_failed.py
          python itu_pdf_bundle/retry_failed.py

      - name: Summarize generated files
        shell: bash
        run: |
          set -euxo pipefail
          find out -type f -name '*.pdf' -print0 | xargs -0 -r file
          printf 'PDF_COUNT=' >> "$GITHUB_STEP_SUMMARY"
          find out -type f -name '*.pdf' | wc -l >> "$GITHUB_STEP_SUMMARY"
          du -sh out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retry bundle
        uses: actions/upload-artifact@v4
        with:
          name: itu-r-1200-1400-retry-bundle
          path: out/ITU-R建议书1200-1400MHz汇总（第二轮补充）
          if-no-files-found: error
          retention-days: 7
