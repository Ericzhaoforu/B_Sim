name: ChatGPT ITU-R literature summary DOCX

on:
  push:
    branches:
      - chatgpt-itu-summary-docx-20261018
    paths:
      - 'tools/generate_itu_summary_docx.py'
      - '.github/workflows/chatgpt-itu-summary-docx.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libreoffice-writer poppler-utils

      - name: Generate Word document
        run: |
          python tools/generate_itu_summary_docx.py
          unzip -t 'generated/ITU-R初评超限后详细分析相关文献主要内容与工程应用指南.docx'

      - name: Render PDF for layout validation
        run: |
          mkdir -p rendered
          libreoffice --headless --convert-to pdf --outdir rendered 'generated/ITU-R初评超限后详细分析相关文献主要内容与工程应用指南.docx'
          pdfinfo 'rendered/ITU-R初评超限后详细分析相关文献主要内容与工程应用指南.pdf'

      - name: Commit generated document
        run: |
          git config user.name 'ChatGPT Document Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add generated/ITU-R初评超限后详细分析相关文献主要内容与工程应用指南.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Add ITU-R literature summary Word document'
            git push origin HEAD:chatgpt-itu-summary-docx-20261018
          fi

      - name: Upload document artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITU-R初评超限后详细分析相关文献主要内容与工程应用指南
          path: |
            generated/ITU-R初评超限后详细分析相关文献主要内容与工程应用指南.docx
            rendered/ITU-R初评超限后详细分析相关文献主要内容与工程应用指南.pdf
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
