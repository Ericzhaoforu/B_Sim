name: ChatGPT M2220 M2305 detailed DOCX

on:
  push:
    branches:
      - chatgpt-m2220-m2305-detailed-docx-20261019
    paths:
      - 'tools/generate_itu_summary_docx.py'
      - '.github/workflows/chatgpt-itu-summary-docx.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx matplotlib
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libreoffice-writer poppler-utils

      - name: Generate Word document
        run: |
          python tools/generate_itu_summary_docx.py
          unzip -t 'generated/ITU-R_M.2220-1与M.2305-1详细解读.docx'

      - name: Render PDF for layout validation
        run: |
          mkdir -p rendered
          libreoffice --headless --convert-to pdf --outdir rendered 'generated/ITU-R_M.2220-1与M.2305-1详细解读.docx'
          pdfinfo 'rendered/ITU-R_M.2220-1与M.2305-1详细解读.pdf'

      - name: Commit generated document
        run: |
          git config user.name 'ChatGPT Document Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add 'generated/ITU-R_M.2220-1与M.2305-1详细解读.docx'
          if ! git diff --cached --quiet; then
            git commit -m 'Add detailed M.2220-1 and M.2305-1 Word guide'
            git push origin HEAD:chatgpt-m2220-m2305-detailed-docx-20261019
          fi

      - name: Upload document artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITU-R_M.2220-1与M.2305-1详细解读
          path: |
            generated/ITU-R_M.2220-1与M.2305-1详细解读.docx
            rendered/ITU-R_M.2220-1与M.2305-1详细解读.pdf
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
