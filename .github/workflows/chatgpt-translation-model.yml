name: ChatGPT ITU-R Chinese translations v4

on:
  push:
    branches:
      - chatgpt-translation-model-20260914
    paths:
      - '.github/workflows/chatgpt-translation-model.yml'
      - 'chatgpt_translation/**'

permissions:
  contents: read
  actions: read

jobs:
  translate:
    strategy:
      fail-fast: false
      matrix:
        report: ['SA.2425', 'SA.2426', 'SA.2427']
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-core poppler-utils fonts-noto-cjk
          fc-cache -f

      - name: Retrieve offline translation model bundle
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf bundle
          mkdir -p bundle
          gh run download 34769744223 \
            --repo "$GITHUB_REPOSITORY" \
            --name opus-mt-en-zh-offline-bundle \
            --dir bundle
          du -sh bundle

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links bundle/wheels \
            transformers==4.48.3 sentencepiece==0.2.2 sacremoses==0.1.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pymupdf==1.26.7 python-docx==1.2.0 requests pillow

      - name: Translate report and generate DOCX
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile chatgpt_translation/translate_itu_reports.py chatgpt_translation/translate_itu_reports_v4.py
          mkdir -p out work
          python chatgpt_translation/translate_itu_reports_v4.py \
            --report '${{ matrix.report }}' \
            --work-dir work \
            --output-dir out \
            --model bundle/model
          ls -lh out

      - name: Extract text and run content checks
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import re

          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          docs=list(Path('out').glob('*.docx'))
          assert len(docs)==1, docs
          path=docs[0]
          with ZipFile(path) as z:
              root=ET.fromstring(z.read('word/document.xml'))
          paras=[]
          for p in root.findall('.//w:p',ns):
              text=''.join(t.text or '' for t in p.findall('.//w:t',ns)).strip()
              if text:
                  paras.append(text)
          full='\n'.join(paras)
          bad_patterns={
              'placeholder': r'ZXQPH|X{8,}',
              'long_underscores': r'_{6,}',
              'replacement_character': r'�',
          }
          failures={name: re.findall(pattern,full)[:10] for name,pattern in bad_patterns.items() if re.search(pattern,full)}
          if failures:
              raise SystemExit(f'Content check failed: {failures}')
          sample='\n'.join(paras[:260])
          (Path('out')/(path.stem+'_文本样本.txt')).write_text(sample,encoding='utf-8')
          (Path('out')/(path.stem+'_全文纯文本.txt')).write_text(full,encoding='utf-8')
          print('DOCX:', path.name, 'paragraphs=',len(paras),'characters=',len(full))
          print('----- TRANSLATION SAMPLE START -----')
          print('\n'.join(paras[:110]))
          print('----- TRANSLATION SAMPLE END -----')
          PY

      - name: Render DOCX to PDF and prepare visual QA sheets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p rendered qa/pages qa/sheets
          DOCX=$(find out -maxdepth 1 -name '*.docx' -print -quit)
          libreoffice --headless --convert-to pdf --outdir rendered "$DOCX"
          PDF=$(find rendered -maxdepth 1 -name '*.pdf' -print -quit)
          pdfinfo "$PDF" | tee qa/pdfinfo.txt
          pdftoppm -jpeg -r 72 -jpegopt quality=65,progressive=y "$PDF" qa/pages/page
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math
          pages = sorted(Path('qa/pages').glob('page-*.jpg'))
          per_sheet = 20
          cols, rows = 4, 5
          thumb_w, thumb_h = 280, 396
          margin = 18
          for sheet_index in range(math.ceil(len(pages) / per_sheet)):
              group = pages[sheet_index*per_sheet:(sheet_index+1)*per_sheet]
              canvas = Image.new('RGB', (cols*(thumb_w+margin)+margin, rows*(thumb_h+margin)+margin), 'white')
              draw = ImageDraw.Draw(canvas)
              for i, path in enumerate(group):
                  image = Image.open(path).convert('RGB')
                  image.thumbnail((thumb_w, thumb_h))
                  x = margin + (i % cols)*(thumb_w+margin) + (thumb_w-image.width)//2
                  y = margin + (i // cols)*(thumb_h+margin) + (thumb_h-image.height)//2
                  canvas.paste(image, (x, y))
                  draw.rectangle((x-1, y-1, x+image.width, y+image.height), outline='gray', width=1)
                  draw.text((x+4, y+4), str(sheet_index*per_sheet+i+1), fill='red')
              out = Path('qa/sheets') / f'sheet-{sheet_index+1:03d}.jpg'
              canvas.save(out, quality=82, optimize=True)
          print('Rendered pages:', len(pages), 'QA sheets:', len(list(Path('qa/sheets').glob('*.jpg'))))
          PY
          python - <<'PY'
          from pathlib import Path
          import zipfile
          docs=list(Path('out').glob('*.docx'))
          assert len(docs)==1, docs
          with zipfile.ZipFile(docs[0]) as z:
              assert 'word/document.xml' in z.namelist()
          print('DOCX ZIP integrity: PASS', docs[0], docs[0].stat().st_size)
          PY

      - name: Upload translated report and QA files
        uses: actions/upload-artifact@v4
        with:
          name: itu-r-${{ matrix.report }}-chinese-translation-v4
          path: |
            out/*.docx
            out/*_translation_stats.json
            out/*_文本样本.txt
            out/*_全文纯文本.txt
            rendered/*.pdf
            qa/pdfinfo.txt
            qa/sheets/*.jpg
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
