name: Test clients5 term markers

on:
  push:
    branches:
      - chatgpt-translation-model-20260914
    paths:
      - '.github/workflows/test-clients5-term-markers.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Translate samples with term markers
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          samples=[
            'This Report studies ZZTRM0000ZZ for ZZTRM0001ZZ, using ZZTRM0002ZZ and a 25 kHz necessary bandwidth.',
            'The aggregate interference power spectral density at the earth station is compared with Recommendation ITU-R SA.363-5.',
            'The ZZTRM0003ZZ shall not exceed -176 dBW/kHz for more than 1% of the link time.',
          ]
          text='\nZZUNIT0000ZZ\n'.join(samples)
          q=urllib.parse.quote(text,safe='')
          url='https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=zh-CN&q='+q
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
              out=json.loads(r.read().decode())[0]
          print(repr(out))
          for marker in ['ZZTRM0000ZZ','ZZTRM0001ZZ','ZZTRM0002ZZ','ZZTRM0003ZZ','ZZUNIT0000ZZ']:
              print(marker, marker in out)
          PY
