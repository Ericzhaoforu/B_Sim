name: L-band GNSS detailed assessment documents

on:
  push:
    branches: [chatgpt-lband-gnss-guide-20261023]
    paths:
      - 'task_build/lband_gnss/**'
      - '.github/workflows/chatgpt-lband-gnss-guide.yml'

permissions:
  contents: write

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out only document sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            task_build/lband_gnss
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document and download dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 python-docx pymupdf pypandoc_binary
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk fonts-crosextra-carlito fonts-dejavu-core
      - name: Generate Word and retrieve unmodified public papers
        run: |
          python -m py_compile task_build/lband_gnss/build.py
          python -u task_build/lband_gnss/build.py
      - name: Publish only generated guide documents and metadata
        env:
          BRANCH: chatgpt-lband-gnss-guide-20261023
        run: |
          git config user.name 'Document Builder'
          git config user.email 'noreply@users.noreply.github.com'
          git add --sparse generated/lband_gnss
          git commit -m 'Publish detailed assessment guides and verified download metadata [skip ci]'
          git push origin HEAD:"$BRANCH"
      - name: Attach complete private-delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Lband-Radar-GNSS-Word-and-Papers
          path: out/Lband_Radar_GNSS_Package/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
      - name: Attach Word documents separately
        uses: actions/upload-artifact@v4
        with:
          name: Lband-Radar-GNSS-Word-Documents
          path: |
            out/Lband_Radar_GNSS_Package/01_分析方案与论文导读/*.docx
          retention-days: 30
          if-no-files-found: error
