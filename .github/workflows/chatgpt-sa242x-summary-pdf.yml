name: ChatGPT SA242x summary PDF

on:
  push:
    branches:
      - chatgpt-sa242x-summary-pdf-20260917
    paths:
      - 'chatgpt_pdf_export/**'
      - '.github/workflows/chatgpt-sa242x-summary-pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-sa242x-summary-pdf-20260917

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --upgrade pip
          python -m pip install reportlab==4.4.4

      - name: Generate PDF
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile chatgpt_pdf_export/build_sa242x_summary.py
          python chatgpt_pdf_export/build_sa242x_summary.py
          ls -lh generated

      - name: Validate PDF structure and text
        shell: bash
        run: |
          set -euxo pipefail
          PDF='generated/ITU-R_SA2425_SA2426_SA2427_Chinese_Summary.pdf'
          test -s "$PDF"
          pdfinfo "$PDF" | tee generated/pdfinfo.txt
          pdftotext -layout "$PDF" generated/extracted.txt
          grep -q 'SA.2425' generated/extracted.txt
          grep -q 'SA.2426' generated/extracted.txt
          grep -q 'SA.2427' generated/extracted.txt
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test "$PAGES" -ge 8
          mkdir -p generated/qa
          pdftoppm -f 1 -singlefile -png -r 100 "$PDF" generated/qa/cover
          MID=$(( (PAGES + 1) / 2 ))
          pdftoppm -f "$MID" -singlefile -png -r 100 "$PDF" generated/qa/middle
          file generated/qa/*.png

      - name: Commit generated PDF
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'OpenAI ChatGPT'
          git config user.email 'chatgpt@openai.com'
          git add generated/ITU-R_SA2425_SA2426_SA2427_Chinese_Summary.pdf
          if git diff --cached --quiet; then
            echo 'No PDF changes to commit.'
          else
            git commit -m 'Generate Chinese summary PDF for ITU-R SA.2425-2427'
            git push origin HEAD:chatgpt-sa242x-summary-pdf-20260917
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITU-R-SA2425-SA2426-SA2427-Chinese-Summary
          path: |
            generated/ITU-R_SA2425_SA2426_SA2427_Chinese_Summary.pdf
            generated/pdfinfo.txt
            generated/qa/*.png
          if-no-files-found: error
          retention-days: 7
